<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Projects — Oval</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a0a;
--text:#e8e4df;
--accent:#ff6b35;
--muted:#6b6560;
--card:#141414;
--border:#2a2a2a;
}
body{
font-family:'DM Sans',sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}
nav{
position:fixed;
top:0;left:0;right:0;
padding:2rem 4rem;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(10,10,10,.8);
backdrop-filter:blur(20px);
border-bottom:1px solid var(--border);
z-index:100;
}
.logo{
font-family:'Instrument Serif',serif;
font-size:1.5rem;
font-style:italic;
text-decoration:none;
color:var(--text);
}
.back-link{
color:var(--muted);
text-decoration:none;
font-size:.85rem;
text-transform:uppercase;
display:flex;
gap:.5rem;
align-items:center;
}
.back-link:hover{color:var(--accent)}
.page-header{
padding:10rem 4rem 4rem;
max-width:1400px;
margin:auto;
}
.page-header h1{
font-family:'Instrument Serif',serif;
font-size:clamp(3rem,8vw,6rem);
font-weight:400;
}
.page-header p{
color:var(--muted);
max-width:600px;
line-height:1.7;
margin-top:1rem;
}
.projects-section{
padding:4rem;
max-width:1400px;
margin:auto;
}
.projects-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:2rem;
}
.project-card{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.4s;
}
.project-card:hover{
transform:translateY(-8px);
border-color:rgba(255,107,53,.4);
box-shadow:0 20px 40px rgba(0,0,0,.4);
}
.project-image{
height:280px;
overflow:hidden;
position:relative;
}
.project-image img{
width:100%;
height:100%;
object-fit:cover;
object-position:top left;
transition:.6s;
}
.project-card:hover img{transform:scale(1.08)}
.project-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.6);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition:.3s;
}
.project-card:hover .project-overlay{opacity:1}
.overlay-icon{
width:70px;
height:70px;
background:var(--accent);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}
.overlay-icon svg{
width:28px;
height:28px;
stroke:var(--bg);
stroke-width:2;
fill:none;
}
.project-info{
padding:1.75rem;
}
.project-number{
font-family:'Instrument Serif',serif;
font-size:.9rem;
color:var(--muted);
margin-bottom:.5rem;
}
.project-info h3{
font-family:'Instrument Serif',serif;
font-size:1.5rem;
font-weight:400;
margin-bottom:.5rem;
}
.project-info p{
font-size:.9rem;
color:var(--muted);
margin-bottom:1rem;
}
.project-tags{
display:flex;
gap:.5rem;
flex-wrap:wrap;
}
.tag{
font-size:.7rem;
background:#0f0f0f;
padding:.4rem .8rem;
border-radius:20px;
color:var(--muted);
letter-spacing:.05em;
}

/* Modal */
.image-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
visibility:hidden;
transition:.4s;
z-index:1000;
}
.image-modal.active{
opacity:1;
visibility:visible;
}
.image-modal img{
max-width:90%;
max-height:85vh;
border-radius:12px;
}
.modal-close{
position:absolute;
top:30px;
right:40px;
width:40px;
height:40px;
border-radius:50%;
border:1px solid var(--border);
background:none;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}
.modal-close svg{stroke:var(--text)}
.modal-close:hover{
background:var(--accent);
border-color:var(--accent);
}
.modal-close:hover svg{stroke:var(--bg)}

@media(max-width:900px){
.projects-grid{grid-template-columns:1fr}
nav{padding:1.5rem 2rem}
.page-header{padding:8rem 2rem 3rem}
.projects-section{padding:2rem}
}
</style>
</head>

<body>

<nav>
<a href="index.html" class="logo">Jamal</a>
<a href="index.html" class="back-link">← Back</a>
</nav>

<header class="page-header">
<h1>All <em>Projects</em></h1>


<section class="projects-section">
<div class="projects-grid" id="projectsGrid"></div>
</section>

<div class="image-modal" id="imageModal">
<button class="modal-close" onclick="closeImage()">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2">
<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
</svg>
</button>
<img id="modalImage">
</div>

<script>
const grid=document.getElementById("projectsGrid");

fetch("projects.json")
.then(res=>{
  if(!res.ok) throw new Error("projects.json not found");
  return res.json();
})
.then(items=>{
  items.forEach((item,i)=>{
    const card=document.createElement("div");
    card.className="project-card";
    card.onclick=()=>item.type==="image"
      ?openImage(item.src)
      :window.open(item.url,"_blank");

    card.innerHTML=`
    <div class="project-image">
      <img src="${item.type==="image"?item.src:getYT(item.url)}">
      <div class="project-overlay">
        <div class="overlay-icon">
          ${item.type==="image"?zoomIcon():playIcon()}
        </div>
      </div>
    </div>
    <div class="project-info">
      <div class="project-number">${String(i+1).padStart(2,"0")}</div>
      <h3>${item.title}</h3>
      <p>${item.description||""}</p>
      <div class="project-tags">
        <span class="tag">${item.type.toUpperCase()}</span>
        <span class="tag">ROBLOX</span>
        <span class="tag">LUA</span>
      </div>
    </div>`;
    grid.appendChild(card);
  });
})
.catch(()=>{
  grid.innerHTML="<p style='color:#777'>Failed to load projects.json</p>";
});

function getYT(url){
const id=url.includes("youtu.be")?url.split("youtu.be/")[1]:url.split("v=")[1];
return`https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}
function zoomIcon(){return`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round"
d="M21 21l-5.197-5.197M10.5 7.5v6m3-3h-6M16 10.5a5.5 5.5 0 11-11 0 5.5 5.5 0 0111 0z"/>
</svg>`}
function playIcon(){return`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round"
d="M14.752 11.168l-5.197-3.03A1 1 0 008 9.03v5.94a1 1 0 001.555.832l5.197-3.03a1 1 0 000-1.664z"/>
</svg>`}

const modal=document.getElementById("imageModal");
const modalImg=document.getElementById("modalImage");
function openImage(src){
modalImg.src=src;
modal.classList.add("active");
document.body.style.overflow="hidden";
}
function closeImage(){
modal.classList.remove("active");
modalImg.src="";
document.body.style.overflow="";
}
</script>

</body>
</html>
